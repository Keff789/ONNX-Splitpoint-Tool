name: smoke_regression_v1
purpose: Lightweight smoke/regression matrix for validating core splitpoint workflows
  after tool changes across one classifier and two detector families.
selection_policy:
  max_accepted_cases_per_model: 2
  preferred_shortlist: 4
  min_gap: 3
  candidate_search_pool: 20
  report_blocked_configs: true
  report_plan_adjustments: true
  keep_partial_hailo_cases: true
  full_model_hailo_preflight_policy: enabled
  selection_strategy: stratified_windows
model_suite:
  primary:
  - id: resnet50
    task: classification
    family: resnet
    source: torchvision
    input_shape:
    - 1
    - 3
    - 224
    - 224
    semantic_dataset: imagenet_val
    development_subset: imagenet_val_mini_200
    note: smoke anchor for classification
  - id: yolo11s
    task: detection
    family: yolo11
    source: ultralytics
    input_shape:
    - 1
    - 3
    - 640
    - 640
    semantic_dataset: coco2017_val
    development_subset: coco_50
    note: classic YOLO smoke detector
  - id: yolo26n
    task: detection
    family: yolo26
    source: ultralytics
    input_shape:
    - 1
    - 3
    - 640
    - 640
    semantic_dataset: coco2017_val
    development_subset: coco_50
    note: end-to-end detector smoke representative
  reserve:
  - mobilenet_v3_large
  - efficientnet_b0
run_profiles:
- id: ort_cuda
  type: same_backend_reference
  full: cuda
  stage1: cuda
  stage2: cuda
  required: true
- id: ort_tensorrt
  type: same_backend_reference
  full: tensorrt
  stage1: tensorrt
  stage2: tensorrt
  required: true
- id: hailo8
  type: same_backend_reference
  full: hailo8
  stage1: hailo8
  stage2: hailo8
  required: false
  treat_preflight_block_as_result: true
- id: hailo8_to_trt
  type: mixed_backend
  full_reference: cpu_full
  stage1: hailo8
  stage2: tensorrt
  required: false
  treat_preflight_block_as_result: true
validation:
  split_fidelity_reference_mode: auto
  classification_metrics:
  - top1
  - top5
  - top1_delta_vs_same_backend_full
  - logit_cosine_similarity
  detection_metrics:
  - semantic_proxy_match_ratio
  - semantic_proxy_mean_iou
  - mini_coco_ap50
  backend_drift_reference: cpu_full
  report_blocked_and_infeasible: true
reporting:
  include_decision_summary: true
  include_backend_drift_block: true
  include_task_specific_quality_block: true
  aggregate_by_model: true
  aggregate_by_run_profile: true
model_preparation:
  mode: current
  note: Keep smoke/regression simple and fast; do not run export screening automatically.
