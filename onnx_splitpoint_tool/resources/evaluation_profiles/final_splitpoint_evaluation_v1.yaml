name: final_splitpoint_evaluation_v1
purpose: Primary thesis evaluation matrix for validating split-inference across heterogeneous
  hardware and across a compact but diverse model suite.
selection_policy:
  max_accepted_cases_per_model: 5
  preferred_shortlist: 10
  min_gap: 2
  candidate_search_pool: auto
  report_blocked_configs: true
  report_plan_adjustments: true
  keep_partial_hailo_cases: true
  full_model_hailo_preflight_policy: skip
  selection_strategy: stratified_windows
model_suite:
  primary:
  - id: resnet50
    task: classification
    family: resnet
    source: torchvision
    input_shape:
    - 1
    - 3
    - 224
    - 224
    semantic_dataset: imagenet_val
    development_subset: imagenet_val_mini_200
    note: classical residual CNN anchor
  - id: mobilenet_v3_large
    task: classification
    family: mobilenet_v3
    source: torchvision
    input_shape:
    - 1
    - 3
    - 224
    - 224
    semantic_dataset: imagenet_val
    development_subset: imagenet_val_mini_200
    note: mobile/depthwise CNN representative
  - id: regnet_x_1_6gf
    task: classification
    family: regnet
    source: torchvision
    input_shape:
    - 1
    - 3
    - 224
    - 224
    semantic_dataset: imagenet_val
    development_subset: imagenet_val_mini_200
    note: modern regular ConvNet representative
  - id: yolo11l
    task: detection
    family: yolo11
    source: ultralytics
    input_shape:
    - 1
    - 3
    - 640
    - 640
    semantic_dataset: coco2017_val
    development_subset: coco_50
    note: large conventional detector with explicit post-processing
  - id: yolo26m
    task: detection
    family: yolo26
    source: ultralytics
    input_shape:
    - 1
    - 3
    - 640
    - 640
    semantic_dataset: coco2017_val
    development_subset: coco_50
    note: end-to-end NMS-free detector representative
  reserve:
  - efficientnet_b0
  - yolo11s
  - yolo26n
  - yolo26l
  - yolo10l
  - convnext_tiny
run_profiles:
- id: ort_cuda
  type: same_backend_reference
  full: cuda
  stage1: cuda
  stage2: cuda
  required: true
- id: ort_tensorrt
  type: same_backend_reference
  full: tensorrt
  stage1: tensorrt
  stage2: tensorrt
  required: true
- id: hailo8
  type: same_backend_reference
  full: hailo8
  stage1: hailo8
  stage2: hailo8
  required: false
  treat_preflight_block_as_result: true
- id: trt_to_hailo8
  type: mixed_backend
  full_reference: cpu_full
  stage1: tensorrt
  stage2: hailo8
  required: false
  treat_preflight_block_as_result: true
- id: hailo8_to_trt
  type: mixed_backend
  full_reference: cpu_full
  stage1: hailo8
  stage2: tensorrt
  required: false
  treat_preflight_block_as_result: true
validation:
  split_fidelity_reference_mode: auto
  classification_metrics:
  - top1
  - top5
  - top1_delta_vs_same_backend_full
  - top5_delta_vs_same_backend_full
  - logit_cosine_similarity
  detection_metrics:
  - semantic_proxy_match_ratio
  - semantic_proxy_mean_iou
  - mini_coco_ap50
  - ap50_delta_vs_same_backend_full
  backend_drift_reference: cpu_full
  report_blocked_and_infeasible: true
reporting:
  include_decision_summary: true
  include_backend_drift_block: true
  include_task_specific_quality_block: true
  aggregate_by_model: true
  aggregate_by_run_profile: true
implementation_note: This matrix should be implemented in the tool as a versioned
  evaluation profile/preset, not as hardcoded logic inside candidate scoring or runtime
  orchestration.
model_preparation:
  mode: screen_yolo_full_hailo
  note: For Ultralytics detection models, screen small export variants until one supports
    full Hailo, then build benchmark sets from the selected variant.
