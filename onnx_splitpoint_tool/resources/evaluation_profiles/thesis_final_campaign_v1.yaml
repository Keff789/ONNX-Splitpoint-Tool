name: thesis_final_campaign_v1
purpose: >-
  Optional strict ranking-generalization template for the final dissertation campaign. It blocks final-mode
  execution until dataset manifests, locked preprocessing/decoder/NMS
  contracts, model-level hold-out attestations, fitted development models, and
  the full-system energy policy are present. Replace the TODO model paths,
  hashes, attestations, and campaign-input paths before use.

campaign:
  id: thesis_final_campaign_v1
  claim_scope: ranking_generalization
  mode: final
  enforcement: strict
  frozen_before_final_campaign: true
  dataset_manifests:
    classification:
      calibration: campaign_inputs/imagenet_train_calibration_manifest.json
      validation: campaign_inputs/imagenet_val_manifest.json
    detection:
      calibration: campaign_inputs/coco2017_train_calibration_manifest.json
      validation: campaign_inputs/coco2017_val_manifest.json
  pipeline_contract_manifest: campaign_inputs/pipeline_contract_manifest.json
  holdout_registry: campaign_inputs/holdout_registry.json
  ranking_model_bundle: campaign_inputs/ranking_model_bundle.json
  energy_calibration_manifest: campaign_inputs/urecs_fs_input_calibration_manifest.json
  require_fitted_stage_time: true
  require_native_handover_model: true
  require_campaign_freeze: true
  require_protocol_freeze: true
  protocol_freeze:
    artifact: campaign_inputs/protocol_freeze_v1.json
    version: "1.0"
    amendment: initial
    # release_identity is resolved from the installed Tool at sealing time.
    # Add an explicit override only as a reviewed protocol amendment.
    evaluation_identity:
      evaluation_id: thesis_final_campaign_v1
    manifests:
      candidate: campaign_inputs/candidate_universe_protocol_manifest.json
      dag: campaign_inputs/dag_analysis_protocol_manifest.json
      prediction: campaign_inputs/prediction_protocol_manifest.json
      policy: campaign_inputs/quality_ranking_policy_manifest.json
      energy: campaign_inputs/energy_protocol_manifest.json
  require_prediction_freeze_approval: true
  prediction_freeze_enabled: true
  require_cryptographic_prediction_signature: false

selection_policy:
  max_accepted_cases_per_model: 5
  preferred_shortlist: 10
  min_gap: 0
  candidate_search_pool: auto
  report_blocked_configs: true
  report_plan_adjustments: true
  keep_partial_hailo_cases: true
  full_model_hailo_preflight_policy: skip
  selection_strategy: candidate_universe

model_suite:
  primary:
    - id: yolov7_paper
      task: detection
      family: yolo7
      family_id: yolo7
      generalization_scope: development
      source: yolov7
      path: TODO_REPLACE_WITH_EXACT_YOLOV7_PAPER_ONNX
      model_sha256: TODO_REPLACE_WITH_SHA256
      input_shape: [1, 3, 640, 640]
      semantic_dataset: coco2017_val
      evaluation_role: development
      validation_tier: final
      candidate_universe_complete: false
      candidate_universe:
        mode: declared_shortlist
        seed: 20260710
      note: Development detector used to fit and inspect the ranking contract.
    - id: resnet50
      task: classification
      family: resnet
      family_id: resnet
      generalization_scope: development
      source: torchvision
      path: TODO_REPLACE_WITH_EXACT_RESNET50_ONNX
