    - id: yolo26s
      task: detection
      family: yolo26
      family_id: yolo26
      generalization_scope: development
      source: ultralytics
      path: TODO_REPLACE_WITH_EXACT_YOLO26S_ONNX
      model_sha256: TODO_REPLACE_WITH_SHA256
