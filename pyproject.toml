[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["onnx_splitpoint_tool*"]

[tool.setuptools.package-data]
onnx_splitpoint_tool = [
  "resources/*.json",
  "resources/**/*.json",
  "resources/**/*.yaml",
  "resources/**/*.yml",
  "resources/**/*.md",
  "resources/**/*.txt",
  "resources/**/*.py",
  "runners/assets/*",
  "runners/harness/*.json",
  "runners/harness/*.txt",
  # Helper scripts invoked inside WSL / managed DFC venv.
  "wsl_inline_check",
  "wsl_inline_build_hef",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "runtime: requires the optional onnxruntime runtime extra",
]
