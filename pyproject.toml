[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "onnx-splitpoint-tool"
version = "2.82"
description = "Single-split boundary analysis for ONNX graphs (GUI + CLI)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "onnx",
  "numpy",
  "matplotlib",
  "pillow",
  "PyYAML",
  "jsonschema",
]

[project.optional-dependencies]
runtime = ["onnxruntime"]
test = ["pytest>=8.3,<9"]
coco = ["pycocotools>=2.0.7"]
datasets = ["kaggle>=1.6"]
final-datasets = ["pycocotools>=2.0.7", "kaggle>=1.6"]

[project.scripts]
onnx-splitpoint-smoke-v282 = "onnx_splitpoint_tool.v282_smoke:main"
